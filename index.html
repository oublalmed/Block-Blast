<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Mobile Optimization -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1a3a5c">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Block Blast">

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-192x192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-192x192.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-192x192.png">

    <!-- SEO -->
    <meta name="description" content="Block Blast - A fun and addictive puzzle game! Place blocks strategically to clear lines and score points.">
    <meta name="keywords" content="block blast, puzzle game, mobile game, block puzzle, casual game">

    <title>Block Blast - Puzzle Game</title>

    <!-- Prevent zoom on double tap -->
    <style>
      * {
        touch-action: manipulation;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
